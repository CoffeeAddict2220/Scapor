<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SCAPOR.de</title>

    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">


    <!-- ========================================
         LEAFLET CSS
         ======================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- ========================================
         SCAPOR CSS
         ======================================== -->

    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/map.css">
    <link rel="stylesheet" href="./styles/spots.css">
    <link rel="stylesheet" href="./styles/markers.css">
    <link rel="stylesheet" href="./styles/pages.css">
    <link rel="stylesheet" href="./styles/navigation.css">
    <link rel="stylesheet" href="./styles/dialogs.css">

    <link
        rel="stylesheet"
        href="./welcome/style.css"
    >

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3869267919028665"
         crossorigin="anonymous"></script>


    <!-- ========================================
         KATEGORIE-FILTER CSS
         ======================================== -->

    <style>

        .category-filter {

            position: fixed;

            top: auto;
            bottom: 14px;
            left: 14px;

            z-index: 1000;

            display: flex;
            flex-direction: column;

            gap: 5px;

            padding: 8px 10px;

            background: #ffffff;

            border: none;

            border-radius: 11px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.18);

        }


        .category-filter label {

            color: #102A43;

            font-size: 15px;

            font-weight: 700;

        }


        .category-filter select {

            min-width: 170px;

            height: 36px;

            padding: 0 10px;

            border: none;

            border-radius: 8px;

            background: #F0F4F8;

            color: #243B53;

            font-family: inherit;

            font-size: 15px;

            cursor: pointer;

        }


        .category-filter select:focus {

            outline: none;

            background: #E5EAF0;

            box-shadow:
                0 0 0 3px
                rgba(16, 42, 67, 0.15);

        }


        @media (max-width: 600px) {

            .category-filter {

                top: auto;
                bottom: calc(20px + env(safe-area-inset-bottom));

                left: 10px;

            }


            .category-filter select {

                min-width: 150px;

            }

        }

    </style>

</head>


<body>

    <iframe
        id="spots-loading-screen"
        class="spots-loading-screen"
        src="./loadingUnit/index.html"
        title="Spots werden geladen"
        aria-label="Spots werden geladen"
    ></iframe>


    <!-- ========================================
         NAVIGATION
         ======================================== -->

    <header class="topbar">

        <a
            href="index.html"
            class="logo"
        >
            SCAPOR<span>.de</span>
        </a>


        <details class="navigation-menu">
            <summary aria-label="Navigation öffnen">
                <span>Menü</span>
                <span class="navigation-menu-icon" aria-hidden="true"></span>
            </summary>
            <nav class="navigation" aria-label="Hauptnavigation">
                <a href="./index.html" class="active" aria-current="page">Karte</a>
                <a href="./contact/index.html">Kontakt</a>
                <a href="./about/index.html">Über SCAPOR</a>
            </nav>
        </details>

    </header>


    <!-- ========================================
         KARTE
         ======================================== -->

    <div id="map"></div>


    <!-- ========================================
         KATEGORIE-FILTER
         ======================================== -->

    <div
        id="category-filter"
        class="category-filter"
    >

        <label
            for="category-filter-select"
        >
            Filter:
        </label>


        <select
            id="category-filter-select"
        >

            <option value="all">
                Alle Kategorien
            </option>

            <option value="Architecture">
                Architecture
            </option>

            <option value="Astro">
                Astro
            </option>

            <option value="Carshooting">
                Carshooting
            </option>

            <option value="Carspotting">
                Carspotting
            </option>

            <option value="Landscape">
                Landscape
            </option>

            <option value="Nature">
                Nature
            </option>

            <option value="Planespotting">
                Planespotting
            </option>

            <option value="Portrait">
                Portrait
            </option>

            <option value="Trainspotting">
                Trainspotting
            </option>

            <option value="Wildlife">
                Wildlife
            </option>

        </select>

    </div>


    <!-- ========================================
         LEAFLET JAVASCRIPT
         ======================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ========================================
         SCAPOR JAVASCRIPT & DATABASE
         ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./scripts/config.js"></script>
    <script src="./scripts/alert-dialog.js"></script>
    <script src="./scripts/map.js"></script>
    <script src="./scripts/spots-data.js"></script>
    <script src="./scripts/spot-creation.js"></script>
    <script src="./scripts/spot-editor.js"></script>
    <script src="./scripts/spot-save.js"></script>
    <script src="./scripts/spot-details.js"></script>
    <script src="./scripts/report-dialog.js"></script>
    <script src="./scripts/report-actions.js"></script>
    <script src="./scripts/app.js"></script>

    <script src="./welcome/script.js"></script>


    <script src="./navigation.js"></script>

</body>

</html>
