    <!-- ========================================
         KATEGORIE-FILTER CSS

    <style>

        .category-filter {

            position: fixed;

            top: auto;
            right: 14px;
            bottom:
                calc(76px + env(safe-area-inset-bottom));

            z-index: 1000;

            display: flex;
            flex-direction: column;

            gap: 5px;

            padding: 8px 10px;

            background: #ffffff;

            border: none;

            border-radius: 11px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.18);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform:
                translateY(10px)
                scale(0.98);

            transform-origin:
                bottom right;

            transition:
                opacity 0.18s ease,
                transform 0.18s ease,
                visibility 0s linear 0.18s;

        }


        .category-filter.category-filter-open {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translateY(0)
                scale(1);

            transition-delay: 0s;

        }


        @media (prefers-reduced-motion: reduce) {

            .category-filter {

                transition: none;

            }

        }


        .category-filter label {

            color: #102A43;

            font-size: 15px;

            font-weight: 700;

        }


        .category-filter select {

            min-width: 170px;

            height: 36px;

            padding: 0 10px;

            border: none;

            border-radius: 8px;

            background: #F0F4F8;

            color: #243B53;

            font-family: inherit;

            font-size: 15px;

            cursor: pointer;

        }


        .category-filter select:focus {

            outline: none;

            background: #E5EAF0;

            box-shadow:
                0 0 0 3px
                rgba(16, 42, 67, 0.15);

        }


        @media (max-width: 600px) {

            .category-filter {

                top: auto;
                right: 10px;
                bottom:
                    calc(72px + env(safe-area-inset-bottom));

            }


            .category-filter select {

                min-width: 150px;

            }

        }

    </style>
