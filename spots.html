<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-3869267919028665">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SCAPOR Spots</title>

</head>


<body>


    <!-- ========================================
         SPOT EDITOR
         ======================================== -->

    <template id="spot-editor-template">

        <div class="marker-form">

            <h3 class="spot-editor-title">
                Neuen Spot erstellen:
            </h3>

            <label>
                Name
            </label>

            <input
                class="spot-name"
                type="text"
                placeholder="Name eingeben"
                autocomplete="off"
                minlength="3"
                maxlength="80"
            >


            <label>
                Beschreibung
            </label>

            <textarea
                class="spot-description"
                placeholder="Beschreibung eingeben"
                maxlength="1000"
            ></textarea>

            <div class="spot-website-field" aria-hidden="true">
                <label for="spot-website">Website</label>
                <input
                    id="spot-website"
                    class="spot-website"
                    type="text"
                    name="website"
                    tabindex="-1"
                    autocomplete="off"
                >
            </div>


            <div class="spot-extra-categories" role="group"
                aria-labelledby="spot-extra-categories-label">
                <div class="spot-extra-categories-heading">
                    <label id="spot-extra-categories-label" for="spot-category-picker">Kategorien</label>
                    <span class="spot-category-count" role="status" aria-live="polite"
                        aria-atomic="true">0 von 3</span>
                </div>
                <select id="spot-category-picker" class="spot-category-picker">
                    <option value="">Kategorie auswählen</option>
                    <option value="Architecture">Architecture</option>
                    <option value="Astro">Astro</option>
                    <option value="Carshooting">Carshooting</option>
                    <option value="Carspotting">Carspotting</option>
                    <option value="Landscape">Landscape</option>
                    <option value="Nature">Nature</option>
                    <option value="Planespotting">Planespotting</option>
                    <option value="Portrait">Portrait</option>
                    <option value="Trainspotting">Trainspotting</option>
                    <option value="Wildlife">Wildlife</option>
                </select>

                <div class="spot-category-chips" hidden></div>
            </div>

            <input type="hidden" class="spot-category">
            <input type="hidden" class="spot-category-extra">
            <input type="hidden" class="spot-category-extra">

            <button
                type="button"
                class="spot-save"
            >
                Speichern
            </button>

        </div>

    </template>


    <!-- ========================================
         GESPEICHERTER SPOT
         ======================================== -->

    <template id="spot-info-template">

        <div class="marker-info">

            <h3 class="spot-title"></h3>


            <p>

                <strong>
                    Kategorien:
                </strong>

                <br>

                <span class="spot-category-value"></span>

            </p>


            <p>

                <strong>
                    Beschreibung:
                </strong>

                <br>

                <span class="spot-description-value"></span>

            </p>


            <p>

                <strong>
                    Position:
                </strong>

                <br>

                <span class="spot-position-value"></span>

            </p>


<!-- ========================================
     SPOT AKTIONEN
     ======================================== -->

<div class="spot-actions">

    <button
        type="button"
        class="spot-map-open"
        aria-expanded="false"
    >
        In Karten öffnen
    </button>

    <button
        type="button"
        class="spot-report"
    >
        Melden
    </button>

</div>


<div class="spot-map-options" hidden>

    <a
        class="spot-map-apple"
        target="_blank"
        rel="noopener noreferrer"
    >
        Apple Karten
    </a>

    <a
        class="spot-map-google"
        target="_blank"
        rel="noopener noreferrer"
    >
        Google Maps
    </a>

</div>


        </div>

    </template>


</body>

</html>
